<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#15171A">
<title>BetonPro · Vairuotojo reisas</title>
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/betonpro-theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="hdr">
    <span class="bp-logo" role="img" aria-label="BetonPro HUB">
      <svg width="34.8" height="34.8" viewBox="0 0 34 34" aria-hidden="true"><rect x="0" y="3" width="22" height="7" fill="#F5C518"/><rect x="8" y="13.5" width="26" height="7" fill="#FAF9F6"/><rect x="3" y="24" width="18" height="7" fill="#FAF9F6" opacity=".45"/></svg>
      <span class="bp-logo-t">BetonPro</span>
      <span class="bp-logo-hub"><i></i><i></i><i></i><i></i>HUB</span>
    </span>
    <div class="hdr-btns">
      <button type="button" class="hdr-btn" id="btn-lang" aria-label="Kalba">LT</button>
      <button type="button" class="hdr-btn" id="btn-aplus" aria-label="Didesnis šriftas" aria-pressed="false">A+</button>
    </div>
  </header>
  <main id="main"></main>
  <div class="foot" id="foot" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
